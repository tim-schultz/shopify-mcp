name: Prepare tarball release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: tarball-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag against package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Release tag must match package.json version.')
          JS
      - run: npm ci
      - run: npm run release:pack
      - name: Verify release checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create draft with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release/*.tgz release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Shopify Product Search $RELEASE_TAG" \
            --notes-file release/RELEASE_NOTES.md
